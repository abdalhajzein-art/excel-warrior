<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منصة الأثـــير | Alatheer AI Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4003">
  <!-- ⭐ مكتبة marked لتحويل الماركداون والجداول إلى HTML نظامي ⭐ -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <div class="app-container">

    <!-- OVERLAY خلف السايدبار للموبايل -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- MAIN AREA -->
    <div class="main-area">

      <header class="top-bar">
        <!-- الجانب الأيمن: زر جلسة جديدة + زر نسخ السجل + وحدة الراديو -->
        <div class="top-bar-right">

          <!-- زر جلسة جديدة -->
          <button id="newChatBtn" class="top-action-btn" title="جلسة جديدة">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>

          <!-- زر نسخ سجل الجلسة -->
          <button id="copyHistoryBtn" class="top-action-btn" title="نسخ سجل الجلسة">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <rect x="2" y="2" width="13" height="13" rx="2" ry="2"></rect>
            </svg>
          </button>

          <!-- ⭐ وحدة راديو الأثير النهائية المضبوطة هندسياً ⭐ -->
          <div class="radio-module">
            
            <!-- الزناد (Trigger) والأيقونة والترويسة -->
            <div id="radioTrigger" class="radio-trigger-box">
              <button id="radioBtn" class="top-action-btn radio-icon-btn" title="راديو الأثير">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="8" width="14" height="10" rx="2" ry="2"></rect>
                  <circle cx="8" cy="13" r="2"></circle>
                  <path d="M17 10c1.5 1 1.5 3 0 4"></path>
                  <path d="M20 9c2 2 2 6 0 8"></path>
                </svg>
              </button>
              
              <!-- حاوية النص المتحرك (المسؤولة عن السلايد حصرياً) -->
              <div class="radio-label-scroll-container">
                <span id="radioLabel" class="radio-label">الأثير FM</span>
              </div>
            </div>

            <!-- زر الإيقاف (مستقل تماماً ويبقى ظاهراً بجانب الكبسولة) -->
            <button id="radioStop" class="radio-switch" style="display:none;" title="إيقاف">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="6" width="12" height="12" rx="2" ry="2"></rect>
              </svg>
            </button>

            <!-- القائمة المنسدلة البلورية (تفتح بحرية دون قص) -->
            <div id="radioDropdown" class="glass-dropdown" style="display: none;">
              <!-- سيتم توليد المحطات هنا عبر الجافاسكريبت -->
            </div>

          </div>
          <!-- نهاية وحدة الراديو -->

        </div>

        <!-- الجانب الأيسر: أيقونة السايدبار وعنوان المنصة -->
        <div class="top-bar-left-group" style="display: flex; align-items: center; gap: 12px;">
          <div class="top-bar-titles" style="text-align: left;">
            <div class="title">الأثـــير AI</div>
            <div class="subtitle">المعمار الذكي المتقدم</div>
          </div>
          <button id="sidebarToggle" class="sidebar-toggle" aria-label="القائمة">
            <span></span><span></span><span></span>
          </button>
        </div>
      </header>

      <!-- شاشة الترحيب الأثيرية الحية -->
      <div id="welcomeScreen" class="welcome-screen">
        <div class="ether-core-container">
          <div class="core-ring outer"></div>
          <div class="core-ring middle"></div>
          <div class="core-ring inner"></div>
          <div class="core-nucleus">✨</div>
        </div>
        <h1 class="welcome-title">مرحباً بك في سيادة الأثير</h1>
        <p class="welcome-subtitle">عقلك الاصطناعي الخاص لتحليل البيانات، هندسة الملفات، وتوليد الرؤى البصرية.</p>
      </div>

      <!-- منطقة المحادثة -->
      <main id="chatArea" class="chat-area"></main>

      <!-- INPUT AREA: الكبسولة الزجاجية العائمة -->
      <div class="input-area">
        <div class="input-capsule-wrapper">
          
          <div id="fileBubbles" class="file-bubbles"></div>

          <div class="input-box">
            <!-- زر الإرسال -->
            <button id="sendBtn" class="send-icon" title="إرسال">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>

            <!-- حقل الكتابة -->
            <textarea id="userInput" placeholder="اكتب رسالتك للأثير..." rows="1"></textarea>

            <!-- أيقونة الإرفاق -->
            <button id="attachBtn" class="attach-icon" title="إرفاق ملف">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>

            <input type="file" id="fileInput" multiple style="display: none;">
          </div>

        </div>
      </div>

    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-emblem">⚡</div>
        <div>
          <div class="sidebar-title">الأثـــير</div>
          <div class="sidebar-sub">AI Suite • السيادة الرقمية</div>
        </div>
      </div>

      <button class="sidebar-btn" id="newSessionBtn">
        <span>+</span> جلسة جديدة
      </button>

      <div class="sidebar-section-title">سجل الجلسات</div>
      <div id="sessionsList" class="sessions-list"></div>

      <div class="sidebar-footer">
        <div class="sidebar-mini">الأثير الإصدار السيادي 4.0 © 2026</div>
      </div>
    </aside>

  </div>

   <script type="module" src="js/main.js?v=4003"></script>

</body>
</html>
